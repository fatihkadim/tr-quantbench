[project]
name = "tr-quantbench"
version = "0.1.0"
description = "Türkçe'de düşük bitli nicemlemenin morfolojik etkisini ölçen değerlendirme çalışması"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "torch>=2.9",
    "transformers>=4.46",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "sentencepiece>=0.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# CUDA 12.8 için PyTorch tekerlekleri (yerel RTX 3050). macOS'ta PyPI'den gelir.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
