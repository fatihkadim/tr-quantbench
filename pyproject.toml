[project]
name = "tr-quantbench"
version = "0.1.0"
description = "Türkçe'de düşük bitli nicemlemenin morfolojik etkisini ölçen değerlendirme çalışması"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.9",
    "transformers>=4.56",
    "huggingface-hub>=0.34",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# CUDA 12.8 için PyTorch tekerlekleri (yerel RTX 3050). macOS'ta PyPI'den gelir.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
